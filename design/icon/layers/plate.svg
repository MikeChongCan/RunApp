<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" version="1.1">
  <defs>
    <!-- Device Plate Translucent Glass Gradient -->
    <linearGradient id="plateGlass" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Device Plate Bevel Stroke -->
    <linearGradient id="plateStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Device / Window Glass Plate -->
  <rect x="240" y="192" width="544" height="640" rx="88" fill="url(#plateGlass)" stroke="url(#plateStroke)" stroke-width="3"/>
  <!-- Subtle top sensor pill / dynamic island -->
  <rect x="462" y="222" width="100" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.32"/>
  <!-- Subtle bottom home indicator bar -->
  <rect x="437" y="798" width="150" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.25"/>
</svg>
