name: RunApp

options:
  bundleIdPrefix: dev.runapp
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # "Sign to Run Locally": ad-hoc signature, no team needed.
    # Release/notarized builds override these with a Developer ID identity + team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  RunApp:
    type: application
    platform: macOS
    sources:
      - path: RunApp
        excludes:
          - "**/.gitkeep"
    info:
      path: RunApp/Info.plist
      properties:
        CFBundleDisplayName: RunApp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 RunApp contributors. MIT License."
        NSPrincipalClass: NSApplication
        # Lets `open -a RunApp <path>` hand folders/projects to an already-running instance
        # (delivered to AppDelegate.application(_:open:)). Rank None: never the default opener.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: Xcode Project
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [com.apple.xcode.project, com.apple.dt.document.workspace]
          - CFBundleTypeName: Swift Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.swift-source]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.runapp.RunApp
        PRODUCT_NAME: RunApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Not sandboxed on purpose: RunApp spawns sweetpad/xcodebuild. No entitlements file.
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  RunAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RunAppTests
    dependencies:
      - target: RunApp
    info:
      path: RunAppTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.runapp.RunAppTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RunApp.app/Contents/MacOS/RunApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  RunApp:
    shared: true
    build:
      targets:
        RunApp: all
        RunAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - RunAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
